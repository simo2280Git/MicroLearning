<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroLearning</title>
    <base href="/" />
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link href="/MicroLearning.styles.css" rel="stylesheet" />
    <link href="/manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
</head>

<body>
    <div id="app">
        <!-- Questo contenuto si vede SOLTANTO durante il download iniziale dei file .wasm -->
        <div class="d-flex flex-column justify-content-center align-items-center vh-100 bg-dark text-white">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="fw-semibold">Caricamento app in corso...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>

    <script>
        if (typeof window.solveSimpleChallenge === 'undefined') {
            window.solveSimpleChallenge = function (challenge) {
                return challenge;
            };
        }
    </script>
</body>

</html>
