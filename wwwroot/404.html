<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MicroLearning</title>
    <script type="text/javascript">
        // Cattura l'URL fallito (es. /MicroLearning/profile) e reindirizza a index.html passando la rotta nella query string
        var segmentCount = 1; // 1 perché il repo è ospitato su /MicroLearning/
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
